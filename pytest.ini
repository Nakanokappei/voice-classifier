[pytest]
# sklearn 内部の randomized SVD / cosine_distances 計算で発生する
# divide by zero / overflow / invalid value in matmul は既知良性のため抑制.
# 意味的な問題は _l2_normalize でゼロ行を e_0 置換する上流対策で排除済み.
filterwarnings =
    ignore:divide by zero encountered in matmul:RuntimeWarning
    ignore:overflow encountered in matmul:RuntimeWarning
    ignore:invalid value encountered in matmul:RuntimeWarning
