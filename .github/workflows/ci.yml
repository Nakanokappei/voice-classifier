name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # プロジェクトの前提は Python 3.10+. 3.10 と 3.12 で互換性を検証
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # hnswlib ships an AVX-enabled prebuilt wheel that triggers
          # "Illegal instruction" on GitHub Actions' CPU on import. Build it
          # from source so it matches the runner's instruction set.
          pip install -r requirements.txt --no-binary hnswlib

      - name: Lint with ruff
        run: |
          pip install ruff
          # Keep the rule set narrow so legacy code is not disturbed; we only
          # care about undefined-name / syntax-level issues in CI.
          ruff check --select E9,F63,F7,F82 src tests

      - name: Run pytest
        run: |
          pytest -v --tb=short
        env:
          # Tests mock out the OpenAI client, so no real key is ever used.
          # Provide a dummy value so any accidental live call fails fast.
          OPENAI_API_KEY: "dummy-not-used-in-tests"
