name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # プロジェクトの前提は Python 3.10+. 3.10 と 3.12 で互換性を検証
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          # 既存コードへの影響を最小化しつつ基本的な品質確認のみ
          ruff check --select E9,F63,F7,F82 src tests

      - name: Run pytest
        run: |
          pytest -v --tb=short
        env:
          # ネットワーク呼び出し系のテストは OPENAI_API_KEY なしで動く前提
          # 万一API呼び出しに達した場合に即失敗させるためダミー値
          OPENAI_API_KEY: "dummy-not-used-in-tests"
