name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # プロジェクトの前提は Python 3.10+. 3.10 と 3.12 で互換性を検証
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # hnswlib / python-igraph ship prebuilt wheels compiled with CPU
          # instruction sets (e.g. AVX) that are not universally available on
          # GitHub Actions runners. Any of them triggers a fatal "Illegal
          # instruction" at import time and crashes pytest before it starts.
          #
          # The Leiden stack (hnswlib + python-igraph + leidenalg) is already
          # optional at runtime — src/tuner.py skips Leiden when any of these
          # fails to import. So in CI we simply skip them: the tuner's core
          # code paths (KMeans, HDBSCAN) still get full coverage, and the
          # Leiden test (`test_leiden_sweep_runs_when_available`) auto-skips
          # via its `_LEIDEN_AVAILABLE` guard.
          grep -vE '^(hnswlib|python-igraph|leidenalg)' requirements.txt > /tmp/ci-requirements.txt
          pip install -r /tmp/ci-requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          # Keep the rule set narrow so legacy code is not disturbed; we only
          # care about undefined-name / syntax-level issues in CI.
          ruff check --select E9,F63,F7,F82 src tests

      - name: Run pytest
        run: |
          pytest -v --tb=short
        env:
          # Tests mock out the OpenAI client, so no real key is ever used.
          # Provide a dummy value so any accidental live call fails fast.
          OPENAI_API_KEY: "dummy-not-used-in-tests"
